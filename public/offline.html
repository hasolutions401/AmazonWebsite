<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>You're offline | Amazon Bazar</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #eef2ff; text-align: center;
        background: radial-gradient(circle at 50% 30%, rgba(14, 165, 255, 0.2), transparent 55%), #0b1120;
      }
      main { max-width: 420px; }
      img { width: 200px; height: auto; margin: 0 auto 28px; display: block; }
      h1 { font-size: 1.6rem; margin-bottom: 10px; }
      p { color: #94a3b8; line-height: 1.6; margin-bottom: 8px; }
      .actions { display: grid; gap: 10px; margin-top: 26px; }
      a, button {
        display: block; padding: 14px 20px; border-radius: 999px; font: inherit; font-weight: 600;
        text-decoration: none; cursor: pointer;
      }
      a { background: linear-gradient(135deg, #38bdf8, #0ea5ff 40%, #2563eb); color: #fff; border: 0; }
      button { background: transparent; color: #d7f1ff; border: 1px solid rgba(125, 211, 252, 0.55); }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.webp" alt="Amazon Bazar" />
      <h1>You're offline</h1>
      <p>We couldn't load this page without an internet connection.</p>
      <p>1030 Norwich-New London Turnpike, Uncasville, CT 06382<br />Open daily · 9 AM – 10 PM</p>
      <div class="actions">
        <a href="tel:+18608482345">Call (860) 848-2345</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
