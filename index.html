<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#0b1120" />
    <meta name="author" content="Amazon Bazar" />
    <meta name="format-detection" content="telephone=yes" />
    <script>
      // Runs before paint: enables JS-only styles and skips the age gate for verified visitors.

        d.classList.add('js');
        try { if (sessionStorage.getItem('ab-age-verified') === '1') d.classList.add('age-ok'); } catch (e) {}
      })(document.documentElement);
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Amazon Bazar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
